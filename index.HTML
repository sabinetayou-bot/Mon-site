<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>boutique en ligne</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <div class="logo">MaBoutique</div>
    <nav>
      <ul>
        <li><a href="#">Accueil</a></li>
        <li><a href="#">Produits</a></li>
        <li><a href="#">À propos</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Bannière -->
  <section class="hero">
    <h1>Bienvenue dans notre Boutique</h1>
    <p>Découvrez nos meilleurs produits au meilleur prix</p>
    <a href="#" class="btn">Voir les produits</a>
  </section>

  <!-- Produits -->
  <section class="products">
    <h2>Nos Produits</h2>
    <div class="product-grid">
      <div class="product-card">
        <img src="Images/produit1.jpg.jpg" alt="Produit 1">
        <h3>Produit 1</h3>
        <p>Prix : 20€</p>
        <button>Ajouter au panier</button>
      </div>

      <div class="product-card">
        <img src="Images/poduit2.jpg.jpg" alt="Produit 2">
        <h3>Produit 2</h3>
        <p>Prix : 35€</p>
        <button>Ajouter au panier</button>
      </div>

      <div class="product-card">
        <img src="Images/produit1.jpg.jpg" alt="Produit 3">
        <h3>Produit 3</h3>
        <p>Prix : 50€</p>
        <button>Ajouter au panier</button>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 MaBoutique - Tous droits réservés.</p>
  </footer>
                                             
</body>
</html>
